name: build
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_CACHE: ${{ github.workspace }}/.gradle-docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .gradle-docker
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Free disk space (CLion download is large)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - run: |
          mkdir -p .gradle-docker
          export UID GID=$(id -g)
          make image test build verify
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/**
