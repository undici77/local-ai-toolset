services:
  build:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { UID: "${UID:-1000}", GID: "${GID:-1000}" }
    volumes:
      - .:/src
      - ${GRADLE_CACHE:-gradle-cache}:/home/dev/.gradle
    working_dir: /src
    environment:
      - CERTIFICATE_CHAIN
      - PRIVATE_KEY
      - PRIVATE_KEY_PASSWORD
      - PUBLISH_TOKEN
volumes:
  gradle-cache:
